# ====================================================================
# SKILL DNA Platform: Subpath Configuration for existing domain
# URL: https://english.ultrasoft.uz/skilldna
# ====================================================================

location = /skilldna {
    return 301 /skilldna/;
}

location ^~ /skilldna/ {
    alias /var/www/skill-dna/dist/;
    index index.html;
    try_files $uri $uri/ /skilldna/index.html;
}

location ^~ /skilldna/api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 60s;
}

location ^~ /skilldna/docs {
    proxy_pass http://127.0.0.1:8000/docs;
    proxy_set_header Host $host;
}

location ^~ /skilldna/openapi.json {
    proxy_pass http://127.0.0.1:8000/openapi.json;
    proxy_set_header Host $host;
}
