version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: skill_dna_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root123}
      POSTGRES_DB: ${POSTGRES_DB:-skill_dna}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skill_dna}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skill_dna_network

  # 2. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skill_dna_backend
    restart: always
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-root123}
      - POSTGRES_DB=${POSTGRES_DB:-skill_dna}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root123}@postgres:5432/${POSTGRES_DB:-skill_dna}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root123}@postgres:5432/${POSTGRES_DB:-skill_dna}
      - SECRET_KEY=${SECRET_KEY:-skilldna-super-secret-key-change-in-production-2026}
      - PROJECT_NAME=SKILL DNA — AI Talent Intelligence Platform
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - skill_dna_network

  # 3. React Vite Frontend + Nginx Reverse Proxy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skill_dna_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - skill_dna_network

volumes:
  postgres_data:
    driver: local

networks:
  skill_dna_network:
    driver: bridge
